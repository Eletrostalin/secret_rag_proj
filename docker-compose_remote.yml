version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: hipaa_backend
    volumes:
      - .:/code
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      - db

  frontend:
    build:
      context: ./ui
    container_name: hipaa_frontend
    volumes:
      - ./ui:/app
    expose:
      - "7860"

  db:
    image: ankane/pgvector:latest
    container_name: hipaa_db
    environment:
      POSTGRES_USER: nickstanchenkov
      POSTGRES_PASSWORD: 010125hipaa
      POSTGRES_DB: rag_hipaa
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d

  nginx:
    image: nginx:latest
    container_name: hipaa_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

  ngrok:
    build:
      context: ./ngrok
    container_name: hipaa_ngrok
    command: ["http", "nginx:80"]
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    depends_on:
      - nginx

volumes:
  pg_data: